name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly published rule finds existing code without waiting for
    # the next commit.
    - cron: "17 4 * * 1"

jobs:
  analyze:
    name: Analyze JavaScript
    # Analysis only reads the source; Linux is faster and cheaper than the
    # Windows runner used for tests.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-and-quality also reports maintainability issues, which on a
          # codebase this size is mostly noise. Keep the signal on security.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
