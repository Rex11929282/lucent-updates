name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows runner: the release preflight and several tests assert on
    # Windows-specific behaviour, and Lucent only targets Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        # Tests and the renderer build do not need Electron's download/prepare
        # hooks; keeping install script-free also avoids untrusted postinstall
        # code on the CI runner and makes the job faster.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Release preflight
        env:
          LUCENT_UPDATE_REPOSITORY: Rex11929282/lucent-updates
          LUCENT_RELEASE_CHANNEL: stable
        run: npm run release:check

      - name: Test
        run: npm test

      - name: Build renderer
        run: npm run build
